version: v0.3.0

listeners:
  - type: model
    name: model_listener
    address: 0.0.0.0
    port: 12000
    timeout: 30s

model_providers:
  - access_key: $OPENAI_API_KEY
    model: openai/gpt-4o-mini
    default: true

  - access_key: $OPENAI_API_KEY
    model: openai/gpt-3.5-turbo-0125

  - access_key: $OPENAI_API_KEY
    model: openai/gpt-4o
